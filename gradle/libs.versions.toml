[versions]
commons-configuration = "2.15.0"
commons-beanutils = "1.11.0"
slf4j = "2.0.18"
junit-bom = "5.14.4"
mockito = "5.23.0"

[libraries]
commons-configuration = { module = "org.apache.commons:commons-configuration2", version.ref = "commons-configuration" }
commons-beanutils = { module = "commons-beanutils:commons-beanutils", version.ref = "commons-beanutils" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jcl-over-slf4j = { module = "org.slf4j:jcl-over-slf4j", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[bundles]
slf4j-runtime = ["jcl-over-slf4j", "slf4j-simple"]

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.9.0" }
javacc = { id = "ca.coglinc2.javacc", version = "3.0.0" }
sonarqube = { id = "org.sonarqube", version = "7.3.0.8198" }
versions = { id = "com.github.ben-manes.versions", version = "0.54.0" }
beryx-jlink = { id = "org.beryx.jlink", version = "4.0.0" }
dependency-analysis = { id ="com.autonomousapps.dependency-analysis", version = "2.19.0" }
